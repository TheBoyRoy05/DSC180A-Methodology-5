name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/theboyroy05/dsc180a-ma5

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE" .

      - name: Check the required packages
        run: >
          docker run --rm --entrypoint bash "$IMAGE" -c
          'for p in aria2c nmap traceroute; do which "$p" || { echo "missing: $p"; exit 1; }; done;
          python -c "import geopandas, babypandas; from importlib.metadata import version; print(version(\"babypandas\"))"'

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
