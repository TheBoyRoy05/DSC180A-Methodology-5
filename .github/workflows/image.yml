name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/theboyroy05/dsc180a-ma5

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE" .

      - name: Check the required packages
        run: >
          docker run --rm "$IMAGE" bash -c
          "which aria2c nmap traceroute && python -c 'import geopandas, babypandas; print(babypandas.__version__)'"

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
